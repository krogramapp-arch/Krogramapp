name: KroGram
options:
  bundleIdPrefix: com.krogram
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  knownRegions: [ar, en, Base]
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    branch: main
targets:
  KroGram:
    type: application
    platform: iOS
    sources:
      - path: KroGram
    dependencies:
      - package: TDLibFramework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krogram.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KroGram
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  KroGramTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KroGramTests
    dependencies:
      - target: KroGram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krogram.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KroGram:
    build:
      targets:
        KroGram: all
        KroGramTests: [test]
    test:
      targets:
        - KroGramTests
