workflows:
  krochat-unsigned-ipa:
    name: KroChat - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        XCODE_PROJECT: "KroChat.xcodeproj"
        XCODE_SCHEME: "KroChat"
    scripts:
      - name: Install XcodeGen and generate project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          APP_PATH="$(find build/DerivedData/Build/Products \
            -type d -name '*.app' -path '*iphoneos*' | head -n 1)"
          test -n "$APP_PATH" || {
            echo "App bundle not found"
            exit 1
          }
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -qr "$CM_BUILD_DIR/KroChat-unsigned.ipa" Payload
    artifacts:
      - KroChat-unsigned.ipa

  krochat-ipa:
    name: KroChat - Ad Hoc IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.krochat.app
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project KroChat.xcodeproj --scheme KroChat
    artifacts:
      - build/ios/ipa/*.ipa
