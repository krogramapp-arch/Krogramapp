workflows:
  krogram-build-test:
    name: KroGram - Build & Test
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Locate KroGram project
        script: |
          PROJECT_DIR="$CM_BUILD_DIR/KroGram"
          if [ ! -f "$PROJECT_DIR/project.yml" ]; then
            echo "KroGram/project.yml is missing from the repository"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$PROJECT_DIR"
          xcodegen generate
      - name: Build and test on iOS Simulator
        script: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available | sed -nE 's/.*iPhone[^()]*\(([0-9A-F-]{36})\).*/\1/p' | head -n 1)"
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator was found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/build"
          xcodebuild test \
            -project KroGram.xcodeproj \
            -scheme KroGram \
            -destination "id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$PROJECT_DIR/build/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/xcodebuild-test.log"
    artifacts:
      - KroGram/build/TestResults.xcresult
      - xcodebuild-test.log

  krogram-unsigned-ipa:
    name: KroGram - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Locate KroGram project
        script: |
          PROJECT_DIR="$CM_BUILD_DIR/KroGram"
          if [ ! -f "$PROJECT_DIR/project.yml" ]; then
            echo "KroGram/project.yml is missing from the repository"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$PROJECT_DIR"
          xcodegen generate
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild \
            -project KroGram.xcodeproj \
            -scheme KroGram \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PROJECT_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee "$CM_BUILD_DIR/xcodebuild-unsigned.log"
      - name: Package unsigned IPA
        script: |
          APP_PATH="$(find "$PROJECT_DIR/build/DerivedData/Build/Products" \
            -type d -name '*.app' -path '*iphoneos*' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "KroGram.app was not found after the build"
            exit 1
          fi
          PACKAGE_DIR="$CM_BUILD_DIR/ipa"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/"
          cd "$PACKAGE_DIR"
          zip -qr "$CM_BUILD_DIR/KroGram-unsigned.ipa" Payload
    artifacts:
      - KroGram-unsigned.ipa
      - xcodebuild-unsigned.log

  krogram-ipa:
    name: KroGram - Ad Hoc IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.krogram.app
    scripts:
      - name: Locate KroGram project
        script: |
          PROJECT_DIR="$CM_BUILD_DIR/KroGram"
          if [ ! -f "$PROJECT_DIR/project.yml" ]; then
            echo "KroGram/project.yml is missing from the repository"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$PROJECT_DIR"
          xcodegen generate
      - name: Set up code signing
        script: |
          cd "$PROJECT_DIR"
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcode-project build-ipa --project KroGram.xcodeproj --scheme KroGram \
            2>&1 | tee "$CM_BUILD_DIR/xcodebuild-signed.log"
          IPA_PATH="$(find "$PROJECT_DIR/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "Signed KroGram IPA was not found"
            exit 1
          fi
          cp "$IPA_PATH" "$CM_BUILD_DIR/KroGram.ipa"
    artifacts:
      - KroGram.ipa
      - xcodebuild-signed.log
