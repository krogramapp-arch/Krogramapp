name: KroChat
options:
  bundleIdPrefix: com.krochat
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  knownRegions: [ar, en, Base]
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KroChat:
    type: application
    platform: iOS
    sources:
      - path: KroChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krochat.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KroChat
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  KroChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KroChatTests
    dependencies:
      - target: KroChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krochat.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KroChat:
    build:
      targets:
        KroChat: all
        KroChatTests: [test]
    test:
      targets:
        - KroChatTests
